name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas

      - name: Run tests
        working-directory: module-1/mini-aiops-rag-demo
        env:
          PYTHONPATH: .
        run: |
          pytest -q
